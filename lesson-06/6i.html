<!DOCTYPE html>

<html>
  <head></head>
  <body>
    <script>
      const randomNumber = Math.random();
      console.log(randomNumber);

      const guess = 'tails';

      let result;

      if(randomNumber < 0.5) {
        result = 'heads';
      } else {
        result = 'tails';
      }

      console.log(`Result: ${result}`);

      if(result === guess) {
        console.log('You win!')
      } else {
        console.log('You lose!')
      }
    </script>
  </body>
</html>
