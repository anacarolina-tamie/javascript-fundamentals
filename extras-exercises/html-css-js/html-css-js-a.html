<!DOCTYPE html>

<html>

<head>
  <link rel="stylesheet" href="styles/html-css-js-a.css">
</head>

<body>
  <p class="title">
    Rock Paper Scissors
  </p>

  <button class="move-button" onclick="playGame('Rock')">
    <img class="move-icon" src="images/rock-emoji.png">
  </button>
  <button class="move-button" onclick="playGame('Paper')">
    <img  class="move-icon" src="images/paper-emoji.png">
  </button>
  <button class="move-button" onclick="playGame('Scissors')">
    <img class="move-icon" src="images/scissors-emoji.png">
  </button>

  <p class="js-result result">
    Result
  </p>
  <p class="js-moves moves">
  </p>
  <p class="js-score">
    Score
  </p>

  <button class="reset-score-button" onclick="resetScore();">
    Reset Score
  </button>

  <script src="js/html-css-js-a.js"></script>
</body>

</html>
