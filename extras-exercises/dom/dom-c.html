<!DOCTYPE html>

<html>

<head></head>

<body>
  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>
  <input class="js-cost-input" 
    placeholder="Cost of order" 
    onkeydown="handleCostKeyDown(event);
  ">
  <button class="js-calculate-button" onclick="calculateTotal();
  ">Calculate
  </button>
  <p class="js-total-cost"></p>

  <script>
    function calculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      const costOfOrder = Number(inputElement.value * 100);

      let totalCost = '';

      if (costOfOrder < 4000) {
        totalCost = (costOfOrder + 1000) / 100;
      } else {
        totalCost = costOfOrder / 100;
      }

      const totalCostElement = document.querySelector('.js-total-cost');
      totalCostElement.innerHTML = `Total cost: $${totalCost}`
    }

    function handleCostKeyDown(event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    }
  </script>
</body>

</html>
