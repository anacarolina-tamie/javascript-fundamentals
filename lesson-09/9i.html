<!DOCTYPE html>
<html>

<head></head>

<body>
  <button onclick="
    console.log(`Cart quantity: ${cartQuantity}`)
  ">
    Show Quantity
  </button>
  <button onclick="updateCartQuantity(1);">
    Add to Cart
  </button>
  <button onclick="updateCartQuantity(2);">
    +2
  </button>
  <button onclick="updateCartQuantity(3);">
    +3
  </button>
  <button onclick="updateCartQuantity(4);">
    +4
  </button>
  <button onclick="updateCartQuantity(5);">
    +5
  </button>
  <button onclick="updateCartQuantity(-1);">
    Remove from Cart
  </button>
  <button onclick="updateCartQuantity(-2);">
    -2
  </button>
  <button onclick="updateCartQuantity(-3);
  ">
    -3
  </button>
  <button onclick="resetCart()">
    Reset Cart
  </button>

  <p class="js-text"></p>

  <script>
    let cartQuantity = Number(localStorage.getItem('cartQuantity')) || 0;

    const textElement = document.querySelector('.js-text');
    textElement.innerHTML = `Cart quantity: ${cartQuantity}`;

    function updateCartQuantity(quantity) {
      if (cartQuantity + quantity > 10) {
        alert(`Cart is full (${cartQuantity} items).\nLimit: 10 items`);
        return;
      }

      if (cartQuantity + quantity < 0) {
        alert(`Not enough items in the cart (${cartQuantity} items)`);
        return;
      }

      cartQuantity += quantity;

      textElement.innerHTML = `Cart quantity: ${cartQuantity}`
      localStorage.setItem('cartQuantity', cartQuantity);
    }

    function resetCart() {
      cartQuantity = 0;
      localStorage.clear();
      textElement.innerHTML = `Cart quantity: ${cartQuantity}`
    }

  </script>

</body>

</html>
