<!DOCTYPE html>

<html>
  <head></head>

  <body>
    <input class="js-input" placeholder="Name" onkeydown="handleCostKeyDown(event)">
    <button onclick="displayName()">
      Submit
    </button>
    <p class="js-text"></p>

    <script>
      function displayName() {
        const inputElement = document.querySelector('.js-input')
      
        const textElement = document.querySelector('.js-text');
        textElement.innerHTML = `Your name is: ${inputElement.value}`;
      }

      function handleCostKeyDown(event) {
        if(event.key === 'Enter') {
          displayName();
        }
      }
    </script>
  </body>
</html>
