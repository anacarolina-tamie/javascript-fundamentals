<body>
  <script>
    greet('Ana Carolina');
    greet('Camila');
    greet('Lukas');
    greet();

    function greet(name) {
      if (!name) {
        console.log('Hi there!')
      } else {
        console.log(`Hello ${name}!`);
      }
    }
    
  </script>
