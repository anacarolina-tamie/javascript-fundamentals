<!DOCTYPE html>

<html>

<head>
</head>

<body>
  <script>
    const result1 = convertLength(5, 'milesa', 'km');
    const result2 = convertLength(5, 'miles', 'fta');
    const result3 = convertLength(5, 'kma', 'kmb');
    const result4 = convertLength(50, 'ft', 'mileas');

    console.log(result1);
    console.log(result2);
    console.log(result3);
    console.log(result4);

    function convertLength(length, from, to) {
      if (from !== 'miles' && from !== 'km' && from !== 'ft') {
        return `Invalid unit ${from}`;
      }
      if (to !== 'miles' && to !== 'km' && to !== 'ft') {
        return `Invalid unit ${to}`;
      }

      if (from === 'miles') {
        if (to === 'km') {
          const result = length * 1.6;
          return `${result} km`;
        } else if (to === 'miles') {
          const result = length;
          return `${result} miles`;
        } else if (to === 'ft') {
          const result = length * 5280;
          return `${result} ft`;
        }

      } else if (from === 'km') {
        if (to === 'miles') {
          const result = length / 1.6;
          return `${result} miles`;
        } else if (to === 'km') {
          const result = length;
          return `${result} km`;
        } else if (to === 'ft') {
          const result = length * 3281;
          return `${result} ft`;
        }

      } else if (from === 'ft') {
        if (to === 'miles') {
          const result = length / 5280;
          return `${result} miles`;
        } else if (to === 'km') {
          const result = length / 3281;
          return `${result} km`;
        } else if (to === 'ft') {
          const result = length;
          return `${result} ft`;
        }
      }
    }
  </script>
</body>

</html>
