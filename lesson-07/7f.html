<body>
  <script>
    const result1 = convertTemperature(25, 'C');
    const result2 = convertTemperature(86, 'F');

    console.log(result1);
    console.log(result2);

    function convertTemperature(degrees, unit) {
      if (unit === 'F') {
        const celsius = (degrees - 32) * 5 / 9;
        return `${celsius}°C`
      } else {
        const fahrenheit = (degrees * 9) / 5 + 32;
        return `${fahrenheit}°F`
      }
    }
  </script>
</body>

</html>
